<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电费监控</title>
    <style>
        :root {
            --bg: #0b0f12;
            --card: #141820;
            --border: #1e2530;
            --text: #d4d8dd;
            --muted: #6b7280;
            --accent: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .icon-row {
            margin-bottom: 24px;
        }
        .icon {
            width: 56px; height: 56px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(245,158,11,0.05));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 3px; margin: 10px 0 4px; }

        .balance {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #fff;
            line-height: 1.1;
        }
        .balance .num.low  { color: var(--red); }
        .balance .num.ok   { color: var(--green); }
        .balance .num.mid  { color: var(--accent); }
        .balance .unit { font-size: 0.9rem; font-weight: 400; color: var(--muted); margin-left: 2px; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .info-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: left;
        }
        .info-item .info-label {
            font-size: 0.68rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-item .info-value {
            font-size: 0.88rem;
            margin-top: 3px;
            color: #e0e0e0;
            word-break: break-all;
        }

        .note {
            margin-top: 8px;
            padding: 10px 14px;
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.15);
            border-radius: 8px;
            font-size: 0.78rem;
            color: var(--accent);
            text-align: left;
            line-height: 1.5;
        }

        .meta-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
            font-size: 0.73rem;
            color: var(--muted);
            flex-wrap: wrap;
        }
        .meta-row span { display: flex; align-items: center; gap: 5px; }

        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
        .dot.ok { background: var(--green); }
        .dot.err { background: var(--red); }

        .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 14px; margin: 16px 0; color: var(--red); font-size: 0.85rem; }

        .footer { margin-top: 20px; font-size: 0.65rem; color: var(--muted); opacity: 0.5; }

        .loading-anim { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-row"><div class="icon">⚡</div></div>

    <!-- 加载 -->
    <div id="loading" class="loading-anim">
        <div class="balance" style="color:var(--muted)">--</div>
        <div class="label">查询中...</div>
    </div>

    <!-- 正常 -->
    <div id="normal" style="display:none">
        <div class="label">剩余电量</div>
        <div class="balance"><span class="num" id="kwh">--</span><span class="unit">度</span></div>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">住户</div>
                <div class="info-value" id="tenant">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">房间</div>
                <div class="info-value" id="room">--</div>
            </div>
        </div>
        <div class="info-item" style="text-align:left;grid-column:span 2">
            <div class="info-label">地址</div>
            <div class="info-value" id="address">--</div>
        </div>
        <div class="note" id="note" style="display:none"></div>
    </div>

    <!-- 错误 -->
    <div id="error" style="display:none">
        <div class="error" id="errMsg"></div>
    </div>

    <div class="meta-row">
        <span>📱 <span id="phone">---</span></span>
        <span><span class="dot ok" id="dot"></span><span id="time">--</span></span>
    </div>

    <div class="footer">数据来源 i8oa · GitHub Actions 自动更新</div>
</div>

<script>
    const API = 'data/dianfei.json';

    function ago(iso) {
        if (!iso) return '--';
        const d = new Date(iso), diff = Date.now() - d;
        if (diff < 6e4) return '刚刚';
        if (diff < 36e5) return Math.floor(diff/6e4) + ' 分钟前';
        if (diff < 864e5) return Math.floor(diff/36e5) + ' 小时前';
        return Math.floor(diff/864e5) + ' 天前';
    }

    async function load() {
        try {
            const r = await fetch(API);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const d = await r.json();
            const info = d;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('phone').textContent = d.phone_masked || '---';
            document.getElementById('time').textContent = ago(d.updated_at);

            if (info.is_error) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('errMsg').textContent = info.full_text || '查询异常';
                document.getElementById('dot').className = 'dot err';
                return;
            }

            document.getElementById('normal').style.display = 'block';

            // 电量
            const kwh = info.balance_kwh;
            const numEl = document.getElementById('kwh');
            numEl.textContent = kwh != null ? kwh : '?';
            if (kwh != null) {
                numEl.className = 'num ' + (kwh < 30 ? 'low' : kwh < 80 ? 'mid' : 'ok');
            }

            document.getElementById('tenant').textContent = info.tenant || '--';
            document.getElementById('room').textContent = info.room || info.address || '--';
            document.getElementById('address').textContent = info.address || info.full_text || '--';

            // 提取温馨提示
            const ft = info.full_text || '';
            const tipMatch = ft.match(/[公区提示温].*?[。\.]/);
            if (tipMatch) {
                const note = document.getElementById('note');
                note.style.display = 'block';
                note.textContent = tipMatch[0];
            }

            document.getElementById('dot').className = 'dot ok';

        } catch (e) {
            console.error(e);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('errMsg').textContent = '数据加载失败';
            document.getElementById('dot').className = 'dot err';
        }
    }

    load();
</script>

</body>
</html>
