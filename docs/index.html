<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电费监控</title>
    <style>
        :root {
            --bg: #0b0f12; --card: #141820; --border: #1e2530;
            --text: #d4d8dd; --muted: #6b7280;
            --accent: #f59e0b; --green: #10b981; --red: #ef4444;
            --radius: 12px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
        .container{max-width:520px;margin:0 auto}

        /* 顶栏 */
        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .topbar h1{font-size:1.2rem;font-weight:700}
        .actions{display:flex;gap:8px}
        .btn{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:0.78rem;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
        .btn:hover{background:#1f2630;border-color:#3a4250}
        .btn.refresh{color:var(--accent);border-color:rgba(245,158,11,.3)}
        .btn.trigger{color:var(--green);border-color:rgba(16,185,129,.3)}
        @keyframes spin{to{transform:rotate(360deg)}}
        .spinning{animation:spin .8s linear infinite}

        /* 主卡片 */
        .main-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;text-align:center;margin-bottom:16px}
        .icon{width:44px;height:44px;margin:0 auto 12px;background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.05));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
        .unit-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-bottom:2px}
        .kwh-num{font-size:3rem;font-weight:800;letter-spacing:-2px;line-height:1.1}
        .kwh-num .num.low{color:var(--red)} .kwh-num .num.mid{color:var(--accent)} .kwh-num .num.ok{color:var(--green)}
        .kwh-num .unit{font-size:.85rem;font-weight:400;color:var(--muted)}
        .info-row{display:flex;justify-content:center;gap:24px;margin-top:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
        .info-row span{display:flex;align-items:center;gap:4px}
        .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
        .dot.ok{background:var(--green)} .dot.err{background:var(--red)}

        /* 趋势图卡片 */
        .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
        .chart-title{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;text-align:center}
        .chart-wrap{position:relative}
        #trendSvg{width:100%;height:200px;display:block}
        .chart-legend{display:flex;justify-content:center;gap:20px;font-size:.68rem;color:var(--muted);margin-top:8px}
        .legend-low{color:var(--red)} .legend-warn{color:var(--accent)} .legend-ok{color:var(--green)}

        /* 历史表 */
        .history-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .history-title{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;text-align:center}
        .h-table{width:100%;font-size:.78rem;border-collapse:collapse}
        .h-table th{text-align:left;padding:6px 8px;color:var(--muted);font-weight:400;font-size:.68rem;border-bottom:1px solid rgba(255,255,255,.05)}
        .h-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.03)}
        .h-kwh{font-weight:700;font-variant-numeric:tabular-nums}
        .h-kwh.low{color:var(--red)} .h-kwh.mid{color:var(--accent)} .h-kwh.ok{color:var(--green)}
        .h-delta{font-size:.7rem}
        .h-delta.down{color:var(--red)} .h-delta.up{color:var(--green)} .h-delta.flat{color:var(--muted)}

        .footer{text-align:center;font-size:.65rem;color:var(--muted);opacity:.4;padding:12px 0 24px}
        .error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px;color:var(--red);font-size:.82rem;text-align:center;margin-bottom:16px;display:none}

        @media(max-width:420px){
            .kwh-num{font-size:2.4rem}
            .main-card{padding:20px 14px}
            .chart-card{padding:12px}
            #trendSvg{height:150px}
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 顶栏 -->
    <div class="topbar">
        <h1>⚡ 电费监控</h1>
        <div class="actions">
            <a class="btn trigger" id="btnTrigger" href="#" target="_blank" title="手动触发更新">🔄 更新</a>
        </div>
    </div>

    <!-- 错误 -->
    <div class="error-msg" id="errorBox"></div>

    <!-- 主卡片 -->
    <div class="main-card">
        <div class="icon">⚡</div>
        <div class="unit-label">剩余电量</div>
        <div class="kwh-num"><span class="num" id="kwhVal">--</span><span class="unit">度</span></div>
        <div class="info-row">
            <span>👤 <span id="tenant">--</span></span>
            <span>📅 <span id="upTime">--</span></span>
            <span><span class="dot ok" id="statusDot"></span>正常</span>
        </div>
    </div>

    <!-- 趋势图 -->
    <div class="chart-card">
        <div class="chart-title">📈 电量趋势</div>
        <div class="chart-wrap">
            <svg id="trendSvg" viewBox="0 0 480 200" preserveAspectRatio="none"></svg>
        </div>
        <div class="chart-legend">
            <span class="legend-low">🔴 &lt;30 告警</span>
            <span class="legend-warn">🟡 30-80 注意</span>
            <span class="legend-ok">🟢 &gt;80 正常</span>
        </div>
    </div>

    <!-- 历史列表 -->
    <div class="history-card">
        <div class="history-title">📋 历史记录</div>
        <table class="h-table">
            <thead><tr><th>时间</th><th>电量</th><th>变化</th></tr></thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div class="footer">数据来源 i8oa · GitHub Actions 自动更新 · <span id="autoRefresh">每5分钟自动刷新</span></div>
</div>

<script>
    const DATA_URL = 'data/dianfei.json';
    const REPO = '690878173/cs_dianfei';
    const REFRESH_INTERVAL = 5 * 60 * 1000;  // 5分钟

    function fmtTime(iso) {
        if (!iso) return '--';
        const d = new Date(iso);
        return d.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    }

    function ago(iso) {
        if (!iso) return '--';
        const diff = Date.now() - new Date(iso);
        if (diff < 6e4) return '刚刚';
        if (diff < 36e5) return Math.floor(diff/6e4) + '分钟前';
        if (diff < 864e5) return Math.floor(diff/36e5) + '小时前';
        return Math.floor(diff/864e5) + '天前';
    }

    function kwhClass(v) {
        if (v == null) return '';
        return v < 30 ? 'low' : (v < 80 ? 'mid' : 'ok');
    }

    // ===== 趋势图 (纯 SVG) =====
    function drawTrend(history) {
        const svg = document.getElementById('trendSvg');
        if (!history || history.length < 1) {
            svg.innerHTML = '<text x="240" y="100" text-anchor="middle" fill="#6b7280" font-size="12">暂无数据</text>';
            return;
        }

        const W = 480, H = 200;
        const pad = {top: 20, right: 20, bottom: 30, left: 20};
        const pw = W - pad.left - pad.right;
        const ph = H - pad.top - pad.bottom;

        const values = history.map(h => h.kwh).filter(v => v != null);
        if (!values.length) return;

        const maxKwh = Math.max(...values, 100);
        const minKwh = Math.min(...values, 0);
        const range = maxKwh - minKwh || 1;

        // 构建点坐标
        const points = history.map((h, i) => {
            const x = pad.left + (history.length === 1 ? pw/2 : (i / (history.length - 1)) * pw);
            const y = pad.top + ph - ((h.kwh - minKwh) / range) * ph;
            return {x, y, kwh: h.kwh, time: h.time};
        });

        // 生成 path
        let pathD = '';
        points.forEach((p, i) => {
            pathD += (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
        });

        // 填充区域
        let areaD = pathD;
        const lastX = points[points.length-1].x;
        areaD += ` L${lastX.toFixed(1)},${pad.top+ph} L${points[0].x.toFixed(1)},${pad.top+ph} Z`;

        const now = new Date();
        let html = '';

        // 阈值线 (30度告警线)
        const warnY = pad.top + ph - ((30 - minKwh) / range) * ph;
        if (warnY > pad.top && warnY < pad.top + ph) {
            html += `<line x1="${pad.left}" y1="${warnY.toFixed(1)}" x2="${pad.left+pw}" y2="${warnY.toFixed(1)}" stroke="#ef4444" stroke-dasharray="5,3" stroke-width="1" opacity="0.5"/>`;
            html += `<text x="${pad.left+pw}" y="${warnY.toFixed(1)}" fill="#ef4444" font-size="9" text-anchor="end" dx="-2" dy="-2">30</text>`;
        }

        // 网格线
        for (let i = 0; i <= 4; i++) {
            const y = pad.top + (ph / 4) * i;
            const val = maxKwh - (range / 4) * i;
            html += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${pad.left+pw}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.04)" stroke-width="1"/>`;
            html += `<text x="${pad.left-4}" y="${y.toFixed(1)}" fill="#6b7280" font-size="9" text-anchor="end" dy="3">${val.toFixed(0)}</text>`;
        }

        // 填充区域
        html += `<path d="${areaD}" fill="url(#grad)" opacity="0.3"/>`;
        html += `<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></linearGradient></defs>`;

        // 折线
        html += `<path d="${pathD}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>`;

        // 数据点
        points.forEach((p, i) => {
            const color = p.kwh < 30 ? '#ef4444' : (p.kwh < 80 ? '#f59e0b' : '#10b981');
            html += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}" stroke="#141820" stroke-width="1"/>`;
        });

        // X 轴标签
        const step = Math.max(1, Math.floor(history.length / 6));
        history.forEach((h, i) => {
            if (i % step === 0 || i === history.length - 1) {
                const x = pad.left + (history.length === 1 ? pw/2 : (i / (history.length - 1)) * pw);
                const label = fmtTime(h.time).slice(0, 5);
                html += `<text x="${x.toFixed(1)}" y="${H-6}" fill="#6b7280" font-size="8" text-anchor="middle">${label}</text>`;
            }
        });

        svg.innerHTML = html;
    }

    // ===== 历史表格 =====
    function renderHistory(history) {
        const tbody = document.getElementById('historyBody');
        if (!history || !history.length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:16px">暂无记录</td></tr>';
            return;
        }
        const reversed = [...history].reverse().slice(0, 30);
        tbody.innerHTML = reversed.map((h, i) => {
            const cls = kwhClass(h.kwh);
            let delta = '';
            if (i < reversed.length - 1) {
                const prev = reversed[i + 1];
                const diff = (h.kwh - prev.kwh).toFixed(2);
                if (diff < 0) delta = `<span class="h-delta down">${diff}</span>`;
                else if (diff > 0) delta = `<span class="h-delta up">+${diff}</span>`;
                else delta = '<span class="h-delta flat">-</span>';
            }
            return `<tr>
                <td style="color:var(--muted)">${fmtTime(h.time)}</td>
                <td class="h-kwh ${cls}">${h.kwh != null ? h.kwh + ' 度' : '?'}</td>
                <td>${delta}</td>
            </tr>`;
        }).join('');
    }

    // ===== 主加载 =====
    async function loadData(silent) {
        try {
            const r = await fetch(DATA_URL + '?t=' + Date.now());
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const d = await r.json();

            // 更新主卡片
            const kwh = d.balance_kwh;
            const numEl = document.getElementById('kwhVal');
            numEl.textContent = kwh != null ? kwh : '?';
            numEl.className = 'num ' + kwhClass(kwh);

            document.getElementById('tenant').textContent = d.tenant || '--';
            document.getElementById('upTime').textContent = ago(d.updated_at);
            document.getElementById('statusDot').className = 'dot ' + (d.is_error ? 'err' : 'ok');

            document.getElementById('errorBox').style.display = d.is_error ? 'block' : 'none';
            if (d.is_error) {
                document.getElementById('errorBox').textContent = '⚠️ ' + (d.full_text || '查询异常');
            }

            // 趋势图
            drawTrend(d.history || []);
            renderHistory(d.history || []);

            // 更新手动触发按钮
            document.getElementById('btnTrigger').href =
                `https://github.com/${REPO}/actions/workflows/update-data.yml`;

            if (!silent) {
                document.getElementById('autoRefresh').textContent =
                    '刚刚刷新 · 每5分钟自动更新';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('errorBox').style.display = 'block';
            document.getElementById('errorBox').textContent = '⚠️ 数据加载失败';
        }
    }

    // 初始加载
    loadData();

    // 定时刷新
    setInterval(() => loadData(true), REFRESH_INTERVAL);
</script>
</body>
</html>
