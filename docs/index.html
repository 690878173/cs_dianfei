<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电费监控</title>
    <!-- trigger deploy -->
    <style>
        :root {
            --bg:#0b0f12;--card:#141820;--border:#1e2530;--text:#d4d8dd;
            --muted:#6b7280;--accent:#f59e0b;--green:#10b981;--red:#ef4444;--radius:12px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
        .container{max-width:520px;margin:0 auto}

        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .topbar h1{font-size:1.1rem;font-weight:700}
        .btn{padding:5px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.72rem;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
        .btn:hover{background:#1f2630}
        .btn.trig{border-color:rgba(16,185,129,.3);color:var(--green)}

        /* 主卡片 */
        .main-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;text-align:center;margin-bottom:12px}
        .icon-row{width:38px;height:38px;margin:0 auto 8px;background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.05));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
        .slabel{font-size:.65rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
        .kwh-num{font-size:2.6rem;font-weight:800;letter-spacing:-1px;line-height:1.1}
        .kwh-num .num.low{color:var(--red)}.kwh-num .num.mid{color:var(--accent)}.kwh-num .num.ok{color:var(--green)}
        .kwh-num .unit{font-size:.75rem;font-weight:400;color:var(--muted)}
        .info-line{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
        .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
        .dot.ok{background:var(--green)}.dot.err{background:var(--red)}

        /* 周趋势图 */
        .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
        .chart-title{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-align:center;margin-bottom:10px}
        #trendSvg{width:100%;height:170px;display:block}

        /* 日报表 */
        .daily-section{margin-bottom:12px}
        .day-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;cursor:pointer;transition:.15s}
        .day-card:hover{border-color:#2e3a48}
        .day-card.active{border-color:var(--accent)}
        .day-header{display:flex;align-items:center;padding:12px 14px;gap:10px}
        .day-date{font-size:.85rem;font-weight:600;min-width:55px}
        .day-bar-wrap{flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden;position:relative}
        .day-bar-fill{height:100%;border-radius:4px;transition:width .4s}
        .day-bar-fill.low{background:var(--red)}.day-bar-fill.mid{background:var(--accent)}.day-bar-fill.ok{background:var(--green)}
        .day-kwh{font-size:.85rem;font-weight:700;min-width:52px;text-align:right}
        .day-consum{font-size:.68rem;color:var(--muted);min-width:40px;text-align:right}
        .day-arrow{font-size:.6rem;color:var(--muted);transition:.2s}
        .day-card.active .day-arrow{transform:rotate(90deg)}

        /* 每日展开 */
        .day-detail{display:none;border-top:1px solid var(--border);padding:8px 14px 12px}
        .day-card.active .day-detail{display:block}
        .hour-list{display:flex;flex-direction:column;gap:2px}
        .hour-row{display:flex;align-items:center;padding:4px 0;font-size:.75rem;gap:10px}
        .hour-time{color:var(--muted);min-width:48px}
        .hour-bar-bg{flex:1;height:4px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden}
        .hour-bar-fill{height:100%;border-radius:2px}
        .hour-bar-fill.low{background:var(--red)}.hour-bar-fill.mid{background:var(--accent)}.hour-bar-fill.ok{background:var(--green)}
        .hour-kwh{font-weight:600;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
        .day-empty{text-align:center;color:var(--muted);padding:8px;font-size:.75rem}

        .error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px;color:var(--red);font-size:.78rem;text-align:center;margin-bottom:12px;display:none}
        .footer{text-align:center;font-size:.62rem;color:var(--muted);opacity:.4;padding:8px 0 20px}

        @media(max-width:400px){
            .kwh-num{font-size:2rem}
            .day-header{padding:10px;gap:6px}
            .day-date{font-size:.75rem;min-width:48px}
            .day-kwh{font-size:.75rem;min-width:44px}
            .day-consum{font-size:.62rem;min-width:34px}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h1>⚡ 电费监控</h1>
        <a class="btn trig" id="btnTrigger" href="#" target="_blank">🔄 更新</a>
    </div>

    <div class="error-msg" id="errorBox"></div>

    <!-- 主卡片 -->
    <div class="main-card">
        <div class="icon-row">⚡</div>
        <div class="slabel">剩余电量</div>
        <div class="kwh-num"><span class="num" id="kwhVal">--</span><span class="unit">度</span></div>
        <div class="info-line">
            <span>👤 <span id="tenant">--</span></span>
            <span><span class="dot ok" id="statusDot"></span> <span id="upTime">--</span></span>
        </div>
    </div>

    <!-- 周趋势 -->
    <div class="chart-card">
        <div class="chart-title">📈 近7天趋势</div>
        <svg id="trendSvg" viewBox="0 0 480 170" preserveAspectRatio="none"></svg>
    </div>

    <!-- 每日明细 -->
    <div class="daily-section" id="dailyList"></div>

    <div class="footer">i8oa · Actions 自动更新 · <span id="refreshHint">每5分钟刷新</span></div>
</div>

<script>
    const DATA_URL = 'data/dianfei.json';
    const REPO = '690878173/cs_dianfei';
    const REFRESH = 5 * 60 * 1000;

    function fmtHM(iso) {
        const d = new Date(iso);
        return d.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    }
    function fmtDate(iso) {
        const d = new Date(iso);
        return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit'});
    }
    function ago(iso) {
        if(!iso) return '--';
        const d = Date.now() - new Date(iso);
        if(d<6e4) return '刚刚';
        if(d<36e5) return Math.floor(d/6e4)+'分钟前';
        if(d<864e5) return Math.floor(d/36e5)+'小时前';
        return Math.floor(d/864e5)+'天前';
    }
    function cls(v) {
        if(v==null)return'';
        return v<30?'low':(v<80?'mid':'ok');
    }
    // 用北京时间(UTC+8)取日期键，避免跨天归组错误
    function dayKey(iso) {
        const d = new Date(iso);
        return new Date(d.getTime() + 8*3600000).toISOString().slice(0,10);
    }
    function fmtDayLabel(isoOrDate) {
        const d = new Date(isoOrDate);
        return new Date(d.getTime() + 8*3600000).toISOString().slice(5,10);
    }
    // 判断是否为「今天」(北京时间)
    function isTodayBJ(dateStr) {
        const now = new Date();
        return dateStr === new Date(now.getTime() + 8*3600000).toISOString().slice(0,10);
    }

    // ===== 按天分组 =====
    function groupByDay(history) {
        const map = {};
        for (const h of history) {
            const dk = dayKey(h.time);
            if (!map[dk]) map[dk] = [];
            map[dk].push(h);
        }
        // 排序
        const days = Object.entries(map).map(([date,items]) => {
            items.sort((a,b)=>new Date(a.time)-new Date(b.time));
            const vals = items.map(i=>i.kwh).filter(v=>v!=null);
            return {
                date,
                items,
                first: items[0],
                last: items[items.length-1],
                min: Math.min(...vals),
                max: Math.max(...vals),
                count: items.length,
            };
        });
        days.sort((a,b)=>b.date.localeCompare(a.date)); // 最新在前
        return days;
    }

    // ===== SVG 周趋势 =====
    function drawTrend(days) {
        const svg = document.getElementById('trendSvg');
        const W=480, H=170, pad={top:12,right:16,bottom:26,left:16};
        const pw=W-pad.left-pad.right, ph=H-pad.top-pad.bottom;

        // 取最近7天, 用每日最后一条数据
        const recent = days.slice(0,7).reverse(); // 从旧到新
        if(!recent.length){svg.innerHTML='<text x="240" y="85" text-anchor="middle" fill="#6b7280" font-size="12">暂无数据</text>';return;}

        const vals = recent.map(d=>d.last.kwh).filter(v=>v!=null);
        if(!vals.length) return;
        const maxV = Math.max(...vals,100), minV = Math.min(...vals,0);
        const range = maxV - minV || 1;

        const pts = recent.map((d,i)=>({
            x: pad.left+(recent.length===1?pw/2:(i/(recent.length-1))*pw),
            y: pad.top+ph-((d.last.kwh-minV)/range)*ph,
            kwh: d.last.kwh,
            date: d.date,
        }));

        let pathD='', areaD='';
        pts.forEach((p,i)=>{pathD+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);});
        areaD=pathD+` L${pts[pts.length-1].x.toFixed(1)},${pad.top+ph} L${pts[0].x.toFixed(1)},${pad.top+ph} Z`;

        let html='';
        // 预警线
        const wy = pad.top+ph-((30-minV)/range)*ph;
        if(wy>pad.top&&wy<pad.top+ph){
            html+=`<line x1="${pad.left}" y1="${wy.toFixed(1)}" x2="${pad.left+pw}" y2="${wy.toFixed(1)}" stroke="#ef4444" stroke-dasharray="4,3" stroke-width="1" opacity=".4"/>`;
        }
        // 网格
        for(let i=0;i<=4;i++){
            const y=pad.top+(ph/4)*i;
            html+=`<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${pad.left+pw}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.03)" stroke-width="1"/>`;
        }
        // 渐变填充
        html+=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></linearGradient></defs>`;
        html+=`<path d="${areaD}" fill="url(#g)" opacity=".25"/>`;
        html+=`<path d="${pathD}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>`;
        // 点
        pts.forEach(p=>{
            const c=p.kwh<30?'#ef4444':(p.kwh<80?'#f59e0b':'#10b981');
            html+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${c}" stroke="#141820" stroke-width="1.5"/>`;
            html+=`<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)-8}" fill="${c}" font-size="9" text-anchor="middle">${p.kwh.toFixed(1)}</text>`;
        });
        // X 标签
        pts.forEach((p,i)=>{
            if(i%Math.max(1,Math.floor(recent.length/6))===0||i===recent.length-1){
                html+=`<text x="${p.x.toFixed(1)}" y="${H-6}" fill="#6b7280" font-size="8" text-anchor="middle">${p.date.slice(5)}</text>`;
            }
        });

        svg.innerHTML=html;
    }

    // ===== 每日卡片 =====
    function renderDaily(days) {
        const container = document.getElementById('dailyList');
        if(!days.length){
            container.innerHTML='<div class="day-card"><div class="day-header" style="justify-content:center;color:var(--muted);font-size:.78rem">暂无历史数据</div></div>';
            return;
        }

        // 计算全局 max 用于条形图比例
        const allKwh = days.flatMap(d=>d.items.map(i=>i.kwh)).filter(v=>v!=null);
        const globalMax = Math.max(...allKwh, 100);

        container.innerHTML = days.map((day, di) => {
            const kwh = day.last.kwh;
            const pct = Math.min(100, ((kwh||0)/globalMax)*100);
            const c = cls(kwh);
            const isToday = isTodayBJ(day.date);

            // 日消耗 = 前一天末值 - 当天末值；最旧一天回退到当天首末差
            let consumeHtml = '';
            const prevDay = days[di + 1];
            if (prevDay && prevDay.last.kwh != null && kwh != null) {
                const diff = (prevDay.last.kwh - kwh).toFixed(2);
                const sign = diff > 0 ? '-' : (diff < 0 ? '+' : '');
                consumeHtml = `<span class="day-consum" style="color:${diff>0.01?'var(--red)':(diff<-0.01?'var(--green)':'var(--muted)')}">${sign}${Math.abs(diff)}度</span>`;
            } else if (!prevDay && day.first.kwh != null && kwh != null) {
                const diff = (day.first.kwh - kwh).toFixed(2);
                const sign = diff > 0 ? '-' : (diff < 0 ? '+' : '');
                consumeHtml = `<span class="day-consum" style="color:${diff>0.01?'var(--red)':(diff<-0.01?'var(--green)':'var(--muted)')}">${sign}${Math.abs(diff)}度</span>`;
            }

            // 小时明细
            const hourRows = day.items.map(h => {
                const hpct = Math.min(100, ((h.kwh||0)/globalMax)*100);
                return `<div class="hour-row">
                    <span class="hour-time">${fmtHM(h.time)}</span>
                    <div class="hour-bar-bg"><div class="hour-bar-fill ${cls(h.kwh)}" style="width:${hpct}%"></div></div>
                    <span class="hour-kwh" style="color:${h.kwh<30?'var(--red)':(h.kwh<80?'var(--accent)':'var(--green)')}">${h.kwh!=null?h.kwh.toFixed(2):'?'} 度</span>
                </div>`;
            }).join('');

            const activeClass = di === 0 ? ' active' : '';

            return `<div class="day-card${activeClass}" data-index="${di}">
                <div class="day-header" onclick="toggleDay(this.parentElement)">
                    <span class="day-date">${isToday?'今天':fmtDayLabel(day.date)}</span>
                    <div class="day-bar-wrap"><div class="day-bar-fill ${c}" style="width:${pct}%"></div></div>
                    <span class="day-kwh" style="color:${kwh<30?'var(--red)':(kwh<80?'var(--accent)':'var(--green)')}">${kwh!=null?kwh.toFixed(2):'?'} 度</span>
                    ${consumeHtml}
                    <span class="day-arrow">▶</span>
                </div>
                <div class="day-detail">
                    ${day.items.length>1
                        ? `<div class="hour-list">${hourRows}</div>`
                        : '<div class="day-empty">仅一条记录</div>'}
                </div>
            </div>`;
        }).join('');
    }

    function toggleDay(card) {
        const wasActive = card.classList.contains('active');
        // 关闭所有
        document.querySelectorAll('.day-card.active').forEach(c=>c.classList.remove('active'));
        // 如果之前没展开，展开当前
        if(!wasActive) card.classList.add('active');
    }

    // ===== 主逻辑 =====
    async function load(silent) {
        try {
            const r = await fetch(DATA_URL+'?t='+Date.now());
            if(!r.ok) throw new Error('HTTP '+r.status);
            const d = await r.json();

            // 卡片
            const kwh = d.balance_kwh;
            const nEl = document.getElementById('kwhVal');
            nEl.textContent = kwh!=null?kwh:'?';
            nEl.className='num '+cls(kwh);
            document.getElementById('tenant').textContent=d.tenant||'--';
            document.getElementById('upTime').textContent=ago(d.updated_at);
            document.getElementById('statusDot').className='dot '+(d.is_error?'err':'ok');

            const eb = document.getElementById('errorBox');
            if(d.is_error){eb.style.display='block';eb.textContent='⚠️ '+(d.full_text||'查询异常');}
            else eb.style.display='none';

            // 分组
            const days = groupByDay(d.history||[]);
            drawTrend(days);
            renderDaily(days);

            document.getElementById('btnTrigger').href=
                `https://github.com/${REPO}/actions/workflows/update-data.yml`;

            if(!silent) document.getElementById('refreshHint').textContent='刚刚刷新 · 每5分钟';
        } catch(e) {
            console.error(e);
            document.getElementById('errorBox').style.display='block';
            document.getElementById('errorBox').textContent='⚠️ 数据加载失败';
        }
    }

    load();
    setInterval(()=>load(true), REFRESH);
</script>
</body>
</html>
